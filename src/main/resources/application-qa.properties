artikos.qa.profiles.GENERALES.consumo-nomina.msg-cod-sis=SAF
artikos.qa.profiles.GENERALES.consumo-nomina.msg-cod-externo=${ARTIKOS_GENERALES_MSG_COD_EXTERNO}

