app.diagnostics.enabled=false
app.admin.enabled=false
app.endpoints.operations.enabled=false
app.config.validation.strict=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.batch.jdbc.initialize-schema=never

management.endpoint.health.show-details=when-authorized
logging.level.cl.atk.nomina.batch=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

atk.batch.default-max-nominas=${ATK_BATCH_DEFAULT_MAX_NOMINAS:50}
atk.batch.max-nominas-per-run=${ATK_BATCH_MAX_NOMINAS_PER_RUN:50}

artikos.http.connect-timeout-ms=${ARTIKOS_HTTP_CONNECT_TIMEOUT_MS:5000}
artikos.http.read-timeout-ms=${ARTIKOS_HTTP_READ_TIMEOUT_MS:30000}
artikos.retry.enabled=${ARTIKOS_RETRY_ENABLED:true}
artikos.retry.max-attempts=${ARTIKOS_RETRY_MAX_ATTEMPTS:3}
artikos.retry.backoff-ms=${ARTIKOS_RETRY_BACKOFF_MS:1000}

artikos.qa.endpoints.nomina-url=${ARTIKOS_NOMINA_URL}
artikos.qa.endpoints.connector-url=${ARTIKOS_CONNECTOR_URL}
artikos.qa.soap-action=
artikos.qa.nomina-soap-action="AtkWs_DocExtractor/EjecutaTrx"
artikos.qa.connector-soap-action="AtkWs_DocConnectorB2B/EjecutaTrx"

procurement.mapping.document-type=CMP
procurement.mapping.cod-sistem=CM
procurement.mapping.company-by-profile.GENERALES=002
procurement.mapping.company-by-profile.VIDA=001
procurement.mapping.num-periodo=${PROCUREMENT_MAPPING_NUM_PERIODO}
procurement.mapping.cod-contbl=${PROCUREMENT_MAPPING_COD_CONTBL}
procurement.mapping.cod-tip-unid=${PROCUREMENT_MAPPING_COD_TIP_UNID}
procurement.mapping.grl-cod-item=${PROCUREMENT_MAPPING_GRL_COD_ITEM}
procurement.mapping.default-currency=${PROCUREMENT_MAPPING_DEFAULT_CURRENCY:CLP}
procurement.mapping.val-tip-cambio=${PROCUREMENT_MAPPING_VAL_TIP_CAMBIO:1}
procurement.mapping.pct-dscnto=${PROCUREMENT_MAPPING_PCT_DSCNTO:0}
procurement.mapping.mto-dscnto=${PROCUREMENT_MAPPING_MTO_DSCNTO:0}
procurement.mapping.pct-iva=${PROCUREMENT_MAPPING_PCT_IVA:19}
procurement.mapping.codigo-rec-iva=${PROCUREMENT_MAPPING_CODIGO_REC_IVA}
procurement.mapping.default-cantidad=${PROCUREMENT_MAPPING_DEFAULT_CANTIDAD:1}

procurement.client.enabled=true
procurement.client.base-url=${PROCUREMENT_BASE_URL}
procurement.client.document-path=/api/v1/document
procurement.client.connect-timeout-ms=${PROCUREMENT_CONNECT_TIMEOUT_MS:5000}
procurement.client.read-timeout-ms=${PROCUREMENT_READ_TIMEOUT_MS:30000}

