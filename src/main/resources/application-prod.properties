app.diagnostics.enabled=false
app.config.validation.strict=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.batch.jdbc.initialize-schema=never

management.endpoint.health.show-details=when_authorized
logging.level.cl.poc.atkbatch=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

artikos.qa.endpoints.nomina-url=${ARTIKOS_NOMINA_URL}
artikos.qa.endpoints.connector-url=${ARTIKOS_CONNECTOR_URL}
artikos.qa.soap-action=
artikos.qa.nomina-soap-action="AtkWs_DocExtractor/EjecutaTrx"
artikos.qa.connector-soap-action="AtkWs_DocConnectorB2B/EjecutaTrx"

