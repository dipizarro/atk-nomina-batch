spring.profiles.active=test
spring.application.name=atk-nomina-batch-poc

spring.datasource.url=jdbc:h2:mem:atk_nomina_batch_test;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=always

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

atk.batch.simulation-nominas=1000
atk.batch.simulation-iterations=100
atk.batch.chunk-size=20
atk.batch.sample-file=classpath:samples/ZSVIDA_Nom15960.xml

